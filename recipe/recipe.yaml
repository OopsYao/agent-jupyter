context:
  version: 0.1.0

package:
  name: agent-jupyter
  version: ${{ version }}

source:
  path: ..

build:
  noarch: python
  python:
    entry_points:
      - agent-jupyter = agent_jupyter.cli:main
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=68
  run:
    - python >=3.12
    - ipykernel >=6.29,<8
    - jupyter_client >=8.6,<9

tests:
  - python:
      imports:
        - agent_jupyter
  - script:
      - agent-jupyter --help
      - python -c "from importlib.resources import files; resource = files('agent_jupyter').joinpath('resources/agent_jupyter_skill.md'); assert resource.is_file(); assert resource.read_text(encoding='utf-8').startswith('---')"
